<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pad:40px;--panel:min(700px,50vw);--ease:cubic-bezier(.2,.7,.2,1)}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
body{background:#fff;color:#000;font-family:Jost,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.u{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

header{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad)}
.top nav{display:flex;align-items:center;gap:clamp(18px,3.6vw,56px)}
.top nav>button,.top nav>a,.top nav>span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;position:relative}
.top nav>button:not(.av):hover::after,.top nav>a:hover::after,.top nav .on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:#000}
.lang button{color:#999;letter-spacing:.16em}
.lang button.cur{color:#000}
.lang i{font-style:normal;color:#ccc;margin:0 6px}
.av{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid #000;padding:2px;flex:0 0 34px;transition:transform .3s var(--ease)}
.av:hover{transform:scale(1.08)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 28%;display:block}
.av em{position:absolute;left:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:#ec7059;border:1.5px solid #fff}
.wm{text-align:center;font-family:"Libre Bodoni",serif;font-weight:400;font-size:clamp(56px,8.2vw,118px);line-height:.95;letter-spacing:.06em;padding-left:.06em;transition:font-size .35s ease;cursor:pointer;overflow:hidden}
.wm span{display:inline-block;animation:rise 1s var(--ease) both}
.wm span:nth-child(2){animation-delay:.06s}.wm span:nth-child(3){animation-delay:.12s}.wm span:nth-child(4){animation-delay:.18s}.wm span:nth-child(5){animation-delay:.24s}
@keyframes rise{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.sub{text-align:center;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;padding:2px 0 16px;color:#222;animation:fade 1s .5s both;transition:opacity .3s,padding .3s,height .3s}
.sub i{font-family:"Libre Bodoni",serif;font-style:italic;text-transform:none;letter-spacing:.02em;font-size:15px;margin:0 4px}
header.small .sub{opacity:0;height:0;padding:0;overflow:hidden}
header.small .wm{font-size:clamp(30px,3.2vw,44px);padding-bottom:6px}
.rule{height:1px;background:#000;margin:0 var(--pad);transform-origin:left;animation:draw 1.1s .2s var(--ease) both}
@keyframes draw{from{transform:scaleX(0)}to{transform:none}}

.filters{display:flex;gap:26px;padding:22px var(--pad) 0;flex-wrap:wrap;animation:fade .8s .5s both}
.filters button{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#888;padding-bottom:4px;border-bottom:1px solid transparent;transition:color .2s}
.filters button:hover{color:#000}
.filters button.on{color:#000;border-bottom-color:#000}
.filters sup{font-size:8px;margin-left:3px;letter-spacing:0}

main>div{width:100%;max-width:1120px;margin:0 auto}
main{display:grid;grid-template-columns:1fr 0;transition:grid-template-columns .5s cubic-bezier(.6,0,.2,1);min-height:calc(100vh - 260px)}
body.open main{grid-template-columns:1fr var(--panel)}
.grid{padding:26px var(--pad) 120px;display:grid;grid-template-columns:repeat(4,1fr);column-gap:30px;row-gap:46px;align-content:start}
body.open .grid{grid-template-columns:repeat(3,1fr)}
.tile{text-align:left;display:block;width:100%;align-self:start;opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.tile.in{opacity:1;transform:none}
.tile.gone{display:none}
.tile .bg{position:relative;display:block;aspect-ratio:4/5;padding:8px;background:var(--c);transition:filter .3s,padding .5s var(--ease)}
.tile .bg::before{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.45);pointer-events:none}
.tile .fr{position:relative;width:100%;height:100%;overflow:hidden}
.tile .fr::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none}
.tile.tall .bg{aspect-ratio:4/5.6}
.tile.off{margin-top:60px}
.tile img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block;transition:transform 1.2s var(--ease)}
.tile:hover img{transform:scale(1.045)}
.tile:hover .bg{padding:11px}
.tile .n{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:12px;display:inline-block}
.tile .c{display:block;font-size:12px;color:#777;margin-top:3px;font-weight:300}
.tile.active .n{text-decoration:underline;text-underline-offset:5px}
.grid.dim .tile:not(.active) .bg{filter:saturate(.8) brightness(1.02)}
.tile.active .bg{outline:1px solid var(--c);outline-offset:4px}

aside{position:sticky;top:var(--hh,214px);height:calc(100vh - var(--hh,214px));overflow:hidden;border-left:1px solid #000;background:#fff;display:none}
body.open aside{display:block}
.qv{overflow-x:hidden;display:grid;grid-template-columns:47% 53%;height:100%;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.vis{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always}
.slide video{max-height:calc(78vh - 150px);max-width:90%;box-shadow:0 30px 40px -20px rgba(0,0,0,.6);display:block}
.slide img{max-height:calc(78vh - 150px);max-width:66%;box-shadow:0 30px 40px -20px rgba(0,0,0,.6);user-select:none;-webkit-user-drag:none}
.vis .arr,.vis .cnt{z-index:2}
.vis .cnt{position:absolute;left:20px;bottom:18px;font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.85)}
.vis.light .cnt{color:rgba(0,0,0,.6)}
.vis .arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;font-size:18px;color:#fff;opacity:.8}
.vis.light .arr{color:#000}
.vis .arr:hover{opacity:1}.vis .prev{left:6px}.vis .next{right:6px}
.vis.portrait{background:#ece9e4;align-items:stretch}
.vis.portrait img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover;object-position:50% 30%;box-shadow:none}
.tx{padding:32px 34px;overflow:auto;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#777;margin-bottom:36px}
.bar button{color:#000;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.pbar{align-items:baseline;gap:16px}
.pbar .k{color:#000}
.k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.tx h2,.page h2{font-family:"Libre Bodoni",serif;font-weight:400;font-size:clamp(28px,2.7vw,38px);line-height:1.08;margin:14px 0 18px}
.page h2 em,.tx h2 em{font-style:italic}
.tx p{font-size:13px;line-height:1.75;color:#333;font-weight:300}
.sw{display:flex;gap:8px;margin-top:24px}
.sw{gap:6px;margin-top:22px}
.sw button{padding:10px 0;width:28px}
.sw button i{display:block;height:1px;background:#ccc;transition:background .3s,height .3s}
.sw button:hover i{background:#888}
.sw button.on i{background:#000;height:2px}
.btn{display:block;margin-top:28px;background:#000;color:#fff;text-align:center;padding:16px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;transition:background .2s}
.btn:hover{background:#333}
.lk{margin-top:16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.meta{margin-top:auto;padding-top:26px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#999;display:flex;justify-content:space-between}

.page{height:100%;overflow:auto;padding:32px 40px 60px;animation:fade .45s ease}
.page p{font-size:13.5px;line-height:1.8;color:#333;font-weight:300;margin-bottom:14px;max-width:560px}
.auto{border-top:1px solid #000;padding:22px 0 26px}
.auto h3{font-family:"Libre Bodoni",serif;font-weight:400;font-size:24px;margin:8px 0 4px}
.auto .hd{font-family:"Libre Bodoni",serif;font-style:italic;font-size:16px;color:#555;margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#000;border:1px solid #000;margin-top:14px}
.steps div{background:#fff;padding:12px;font-size:12px;line-height:1.45}
.steps b{display:block;font-family:"Libre Bodoni",serif;font-weight:400;font-size:18px;margin-bottom:4px}
.flow{display:flex;align-items:flex-start;margin:22px 0 6px}
.node{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.ico{width:58px;height:58px;border-radius:50%;border:1px solid #000;display:grid;place-items:center;background:#fff;color:#111}
.ico svg{width:24px;height:24px}
.ico{position:relative}
.dots{position:absolute;right:-6px;bottom:-2px;display:flex}
.dots i{width:16px;height:16px;border-radius:50%;display:block;border:2px solid #fff}
.dots i+i{margin-left:-6px}
.node b{font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:12px}
.node small{font-size:11.5px;color:#777;font-weight:300;margin-top:4px;line-height:1.4;padding:0 4px}
.arw{flex:0 0 26px;height:58px;position:relative}
.arw::before{content:"";position:absolute;left:0;right:4px;top:50%;height:1px;background:#000}
.arw::after{content:"";position:absolute;right:2px;top:calc(50% - 3px);width:6px;height:6px;border-top:1px solid #000;border-right:1px solid #000;transform:rotate(45deg)}
.legend{display:flex;gap:18px;margin-top:14px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#555}
.legend span{display:flex;align-items:center;gap:7px}.legend i{width:10px;height:10px;border-radius:50%;display:block}
.note{margin-top:14px;font-size:12px;color:#777;font-weight:300;font-style:italic;font-family:"Libre Bodoni",serif}
.res{margin-top:22px;background:#f6f4f0;padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:center}
.res .rk{grid-column:1/-1;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#777}
.res .rn b{display:block;font-family:"Libre Bodoni",serif;font-weight:400;font-size:44px;line-height:1}
.res .rn span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#555;margin-top:6px;max-width:150px;line-height:1.5}
.res p{margin:0;font-size:13.5px;line-height:1.7;color:#222}
.tools{margin-top:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#777}
.list{border-top:1px solid #000;margin-top:14px}
.list div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e5e5e5;font-size:13px}
.list span:last-child{color:#777;font-weight:300;text-align:right}
.career div{display:block}
.career b{font-weight:400;display:flex;justify-content:space-between;gap:12px}
.career b span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#777}
.career small{display:block;color:#777;font-weight:300;font-size:12px;margin-top:3px}
.brands{margin-top:14px;font-size:12px;color:#555;font-weight:300;line-height:1.7}
.brands b{font-family:"Libre Bodoni",serif;font-weight:400;font-size:15px;color:#000}

.maison{display:none;padding:56px var(--pad) 100px;grid-template-columns:minmax(300px,5fr) 7fr;gap:clamp(40px,7vw,120px);animation:fade .6s ease}
body.mpage .maison{display:grid}
body.mpage main{display:none}
.mleft{position:sticky;top:calc(var(--hh,214px) + 40px);align-self:start}
.mbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.mbar button{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.ring{position:relative;width:clamp(180px,17vw,240px);aspect-ratio:1;border-radius:50%;border:1px solid #000;padding:6px}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 28%;display:block}
.ring em{position:absolute;left:calc(14.6% - 9px);top:calc(14.6% - 9px);width:18px;height:18px;border-radius:50%;background:#ec7059;border:2px solid #fff}
.mleft .k{margin-top:34px}
.mleft h2{font-family:"Libre Bodoni",serif;font-weight:400;font-size:clamp(40px,4.6vw,68px);line-height:1;margin:16px 0 30px;letter-spacing:-.01em}
.mleft h2 em{font-style:italic}
.mail{margin-top:22px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-size:13px}
.mail span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#777;width:100%}
.mail a{border-bottom:1px solid #000;padding-bottom:2px}
.mail button{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#777}
.mail button:hover{color:#000}
.mleft .btn{display:inline-block;padding:16px 34px;margin-top:0}
.mright p.lead{font-size:clamp(16px,1.35vw,19px);line-height:1.75;font-weight:300;color:#222;margin-bottom:18px;max-width:640px}
.sec{border-top:1px solid #000;margin-top:56px;padding-top:18px}
.sec>.k{margin-bottom:26px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.nums b{display:block;font-family:"Libre Bodoni",serif;font-weight:400;font-size:clamp(48px,5vw,76px);line-height:1}
.nums span{display:block;margin-top:10px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#555;line-height:1.6}
.logos{display:flex;align-items:center;gap:clamp(34px,4vw,60px)}
.logos span{display:flex;flex-direction:column;align-items:center;gap:12px;color:#111}
.logos svg{width:clamp(38px,3.4vw,50px);height:clamp(38px,3.4vw,50px);display:block}
.logos small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#777}
.tl{display:flex;align-items:center;gap:14px}
.tl svg{width:18px;height:18px;flex:0 0 18px;color:#111}
.tl svg *{fill:currentColor !important}
.names{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 34px;font-family:"Libre Bodoni",serif;font-size:clamp(34px,3.6vw,54px);line-height:1.1}
.names i{font-style:normal;color:#bbb;font-size:.6em}
.journal{display:none;padding:56px var(--pad) 100px;max-width:1100px;margin:0 auto;animation:fade .6s ease}
body.jpage .journal{display:block}
body.jpage main,body.jpage .maison{display:none}
.jhead{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;padding-bottom:30px;border-bottom:1px solid #000}
.jhead h2{font-family:"Libre Bodoni",serif;font-weight:400;font-size:clamp(44px,5vw,72px);line-height:1}
.jhead p{margin-top:14px;font-size:15px;font-weight:300;color:#444;max-width:520px;line-height:1.6}
.jhead button{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.jempty{padding:70px 0;text-align:center}
.jempty .big{font-family:"Libre Bodoni",serif;font-style:italic;font-size:clamp(24px,2.4vw,32px);margin-bottom:12px}
.jempty p{font-weight:300;color:#555;font-size:14px}
.jempty .btn{display:inline-block;padding:14px 40px;margin-top:28px}
.jrow{display:grid;grid-template-columns:60px 1fr auto;gap:24px;align-items:baseline;width:100%;text-align:left;padding:30px 0;border-bottom:1px solid #e3e3e3;transition:padding .4s var(--ease)}
.jrow.wimg{grid-template-columns:60px 1fr 160px auto;align-items:center}
.jrow:hover{padding-left:10px}
.jn{font-family:"Libre Bodoni",serif;font-size:22px;color:#999}
.jm{display:flex;flex-direction:column;gap:8px}
.jt{font-family:"Libre Bodoni",serif;font-size:clamp(22px,2.2vw,30px);line-height:1.15}
.jx{font-size:14px;font-weight:300;color:#555;line-height:1.6;max-width:640px}
.ji{aspect-ratio:4/3;overflow:hidden;border:1px solid #000;padding:4px}.ji img{width:100%;height:100%;object-fit:cover;display:block}
.jr{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#777;white-space:nowrap}
.jr i{font-style:normal;margin-left:8px;color:#000}
.art{max-width:680px;margin:0 auto}
.abar{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:44px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.abar .k{color:#777}
.abar button{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.aimg{width:100%;margin-bottom:36px;display:block}
.art h1{font-family:"Libre Bodoni",serif;font-weight:400;font-size:clamp(34px,4vw,54px);line-height:1.08;margin-bottom:22px}
.art .ax{font-family:"Libre Bodoni",serif;font-style:italic;font-size:20px;color:#333;line-height:1.5;margin-bottom:34px}
.art p{font-size:16.5px;line-height:1.85;font-weight:300;color:#222;margin-bottom:20px}
.aorig{margin-top:44px;padding-top:18px;border-top:1px solid #000;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#777}
footer{border-top:1px solid #000;margin:0 var(--pad);padding:22px 0 30px;display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
footer div{display:flex;gap:14px 30px;flex-wrap:wrap}
footer a,footer span{white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tile{opacity:1;transform:none}}

@media (max-width:860px){
  .slide img,.slide video{max-height:78%}
  .journal{padding-top:30px}
  .jrow,.jrow.wimg{grid-template-columns:1fr;gap:10px}
  .jn{display:none}
  .jhead{flex-direction:column-reverse;align-items:stretch}
  .jhead button{align-self:flex-end}
  .maison{grid-template-columns:1fr;padding-top:30px;gap:30px}
  .mleft{position:static}
  .names{gap:2px 22px}
  .names i{display:none}
  .nums{grid-template-columns:1fr 1fr 1fr;gap:12px}
  .top .hide-m{display:none}
  :root{--pad:18px}
  .top{height:48px}
  .top .hide-m{display:none}
  .top nav{gap:14px}
  .top nav>button,.top nav>a,.top nav>span{font-size:9.5px;letter-spacing:.12em}
  .grid,body.open .grid{grid-template-columns:repeat(2,1fr);column-gap:14px;row-gap:30px}
  .tile.off{margin-top:0}
  .tile.m-off{margin-top:40px}
  main,body.open main{grid-template-columns:1fr}
  aside{position:fixed;inset:0;top:0;height:100vh;z-index:50;border:0}
  .qv{grid-template-columns:1fr;grid-template-rows:52vh auto;overflow:auto}
  .tx{padding:22px 20px 30px;overflow:visible}
  .bar{margin-bottom:18px}
  .page{padding:24px 20px 50px}
  .steps{grid-template-columns:1fr}
  .res{grid-template-columns:1fr}
  .flow{flex-direction:column;align-items:stretch;gap:0}
  .node{flex-direction:row;text-align:left;gap:14px}
  .node b{margin-top:0;min-width:110px}
  .node small{padding:0}
  .arw{flex:0 0 22px;height:22px;width:58px}
  .arw::before{left:50%;right:auto;top:0;bottom:4px;width:1px;height:auto}
  .arw::after{left:calc(50% - 3px);right:auto;top:auto;bottom:3px;transform:rotate(135deg)}
  .filters{gap:18px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{white-space:nowrap}
  footer{flex-direction:column;gap:16px}
}
</style>

<body>
<header id="hd">
  <div class="top">

let L="fr"; try{ L=localStorage.getItem("betob-lang")||"fr"; }catch(e){}
let filter="all", cur=-1, shot=0, page=null;
const t=k=>T[L][k];
const pc=(p,k)=>L==="en"?p.en[k]:p[k];
const isVid=u=>/^data:video|\.(mp4|webm)$/i.test(u);
const pad=n=>String(n).padStart(2,"0");
const grid=document.getElementById("grid"), panel=document.getElementById("panel"), hd=document.getElementById("hd"), fl=document.getElementById("filters");
document.getElementById("avimg").src=PHOTO;
const isLight=c=>{const h=c.replace("#","");const[r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16));return (r*299+g*587+b*114)/1000>160};

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.08});

function renderGrid(first){
  grid.innerHTML=P.map((p,i)=>`<button class="tile" data-i="${i}"><div class="bg" style="--c:${p.bg}"><div class="fr"><img src="${p.s.find(u=>!isVid(u))}" alt="${p.n}"></div></div><span class="n">${p.n}</span><span class="c">${pc(p,"cat")}</span></button>`).join("");
  grid.querySelectorAll(".tile").forEach(el=>{ el.onclick=()=>openProject(+el.dataset.i); });
  applyFilter(first);
}
function applyFilter(first,anim=true){
  const tiles=[...grid.querySelectorAll(".tile")]; let k=0;
  const cols=matchMedia("(max-width:860px)").matches?2:(document.body.classList.contains("open")?3:4);
  tiles.forEach((el,i)=>{
    const show=filter==="all"||P[i].tags.includes(filter);
    el.classList.toggle("gone",!show); el.classList.remove("off","tall","m-off");
    if(show){
      if(k%cols===1) el.classList.add("off");
      if(k%3===1) el.classList.add("tall");
      if(k%2===1) el.classList.add("m-off");
      el.classList.toggle("active",i===cur);
      if(anim){ el.classList.remove("in");
      el.style.transitionDelay=((first?0.35:0)+Math.min(k,8)*0.07)+"s";
      io.unobserve(el); requestAnimationFrame(()=>io.observe(el)); }
      k++;
    }
  });
}
function renderFilters(){
  const keys=["all","ia","bien","fin","mob","code"];
  fl.innerHTML=keys.map(k=>`<button data-f="${k}" class="${k===filter?"on":""}">${t(k)}</button>`).join("");
  fl.querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f; renderFilters(); applyFilter(false);});
}
function setNav(k){document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===k&&!b.classList.contains("av")));}
function syncHH(){document.documentElement.style.setProperty("--hh",hd.offsetHeight+"px");}

function openProject(i,s=0){
  hideMaison(); hideJournal();
  cur=i; shot=s; page=null; const p=P[i];
  const wasOpen=document.body.classList.contains("open");
  document.body.classList.add("open"); setNav("projets");
  grid.classList.add("dim");
  applyFilter(false,false);
  const light=isLight(p.bg);
  panel.innerHTML=`<div class="qv">
    <div class="vis ${light?"light":""}" style="background:${p.bg}">
      <div class="track" id="track">${p.s.map((src,j)=>`<div class="slide">${isVid(src)?`<video src="${src}" autoplay muted loop playsinline preload="metadata"></video>`:`<img src="${src}" alt="${t("shot")} ${j+1} ${p.n}">`}</div>`).join("")}</div>
      ${p.s.length>1?`<button class="arr prev" aria-label="${t("prev")}">←</button><button class="arr next" aria-label="${t("nextShot")}">→</button>`:""}
      <span class="cnt">${pad(shot+1)} / ${pad(p.s.length)}</span>
    </div>
    <div class="tx">
      <div class="bar pbar"><span class="k">${pc(p,"cat")}</span><button class="u" id="close">${t("close")}</button></div>
      <h2>${pc(p,"h")}</h2>
      <p>${pc(p,"d")}</p>
      ${p.s.length>1?`<div class="sw">${p.s.map((src,j)=>`<button data-s="${j}" class="${j===shot?"on":""}" aria-label="${t("shot")} ${j+1}"><i></i></button>`).join("")}</div>`:""}
      <a class="btn" href="${p.url}" target="_blank" rel="noopener">${t("discover")}</a>
      <button class="lk u" id="nextp">${t("next")}</button>
      <div class="meta"><span>${p.n}</span><span>${p.url.includes("vercel")?"Vercel":p.url.includes("github.io")?"GitHub Pages":"Lovable"}</span></div>
    </div></div>`;
  panel.querySelector("#close").onclick=closePanel;
  panel.querySelector("#nextp").onclick=()=>openProject((i+1)%P.length);
  panel.querySelectorAll(".sw button").forEach(b=>b.onclick=()=>setShot(+b.dataset.s));
  const pv=panel.querySelector(".prev"), nx=panel.querySelector(".next");
  if(pv){pv.onclick=()=>setShot((shot-1+p.s.length)%p.s.length,-1); nx.onclick=()=>setShot((shot+1)%p.s.length,1);}
  bindTrack();
  syncHH();
}
function setShot(s,dir,instant){
  const tr=panel.querySelector("#track"); if(!tr) return;
  shot=s; tr.scrollTo({left:s*tr.clientWidth,behavior:instant?"auto":"smooth"}); markShot();
}
function markShot(){
  const p=P[cur]; if(!p) return;
  const c=panel.querySelector(".cnt"); if(c) c.textContent=`${pad(shot+1)} / ${pad(p.s.length)}`;
  panel.querySelectorAll(".sw button").forEach((b,j)=>b.classList.toggle("on",j===shot));
}
function bindTrack(){
  const tr=panel.querySelector("#track"); if(!tr) return;
  if(shot) requestAnimationFrame(()=>tr.scrollTo({left:shot*tr.clientWidth}));
  let raf=0;
  tr.addEventListener("scroll",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
    const i=Math.round(tr.scrollLeft/tr.clientWidth); if(i!==shot){shot=i;markShot();}
  });},{passive:true});
}
function closePanel(){
  if(!document.body.classList.contains("open")) return;
  document.body.classList.remove("open"); cur=-1; page=null; setNav("projets");
  grid.classList.remove("dim"); applyFilter(false,false);
}
function renderMaison(){
  document.getElementById("mh").innerHTML=t("maisonH");
  document.getElementById("nums").innerHTML=t("nums").map(n=>`<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join("");
  document.getElementById("mtools").innerHTML=TOOLN.map((n,i)=>`<div><span class="tl">${TOOLSVG[i]}${n}</span><span>${t("tools")[i]}</span></div>`).join("");
  document.getElementById("logos").innerHTML=COMP.map(c=>`<span title="${c[0]}">${c[1]}<small>${c[0]}</small></span>`).join("");
}
function fmtDate(d){try{return new Date(d).toLocaleDateString(L==="en"?"en-GB":"fr-FR",{day:"numeric",month:"long",year:"numeric"});}catch(e){return d;}}
function jt(a){return a[L]||a.fr;}
function readTime(a){const w=jt(a).b.join(" ").split(/\s+/).length;return Math.max(1,Math.round(w/220));}
function renderJournal(id){
  const jb=document.getElementById("jbody");
  const a=id&&JOURNAL.find(x=>x.id===id);
  document.querySelector(".jhead").style.display=a?"none":"";
  if(a){ const c=jt(a);
    jb.innerHTML=`<article class="art">
      <div class="abar"><button class="u" id="jback">← ${t("back")}</button><span class="k">${fmtDate(a.date)} · ${readTime(a)} ${t("min")}</span></div>
      ${a.img?`<img class="aimg" src="${a.img}" alt="">`:""}
      <h1>${c.t}</h1>${c.x?`<p class="ax">${c.x}</p>`:""}
      ${c.b.map(p=>`<p>${p}</p>`).join("")}
      ${a.src==="linkedin"?`<div class="aorig">${t("orig")}</div>`:""}
    </article>`;
    document.getElementById("jback").onclick=()=>{renderJournal();window.scrollTo({top:0});};
    return;
  }
  if(!JOURNAL.length){
    jb.innerHTML=`<div class="jempty"><p class="big">${t("jSoon")}</p><p>${t("jSoonP")}</p><a class="btn" href="https://betob.lovable.app/linkedin" target="_blank" rel="noopener">LinkedIn</a></div>`;
    return;
  }
  const list=[...JOURNAL].sort((x,y)=>y.date.localeCompare(x.date));
  jb.innerHTML=`<div class="jlist">${list.map((a,i)=>{const c=jt(a);return `<button class="jrow${a.img?" wimg":""}" data-j="${a.id}">
      <span class="jn">${pad(list.length-i)}</span>
      <span class="jm"><span class="k">${fmtDate(a.date)}</span><span class="jt">${c.t}</span>${c.x?`<span class="jx">${c.x}</span>`:""}</span>
      ${a.img?`<span class="ji"><img src="${a.img}" alt=""></span>`:""}
      <span class="jr">${readTime(a)} ${t("min")} <i>→</i></span></button>`}).join("")}</div>`;
  jb.querySelectorAll(".jrow").forEach(r=>r.onclick=()=>{renderJournal(r.dataset.j);window.scrollTo({top:0});});
}
function showJournal(){
  hideMaison(); closePanel(); page="journal"; document.body.classList.add("jpage"); setNav("journal");
  renderJournal(); window.scrollTo({top:0}); syncHH();
}
function hideJournal(){
  if(!document.body.classList.contains("jpage")) return;
  document.body.classList.remove("jpage"); page=null; setNav("projets");
  grid.querySelectorAll(".tile").forEach(el=>el.classList.add("in"));
}
function showMaison(){
  hideJournal();
  closePanel(); page="maison"; document.body.classList.add("mpage"); setNav("maison");
  renderMaison(); window.scrollTo({top:0}); syncHH();
}
function hideMaison(){
  if(!document.body.classList.contains("mpage")) return;
  document.body.classList.remove("mpage"); page=null; setNav("projets");
  grid.querySelectorAll(".tile").forEach(el=>el.classList.add("in"));
}
function openPage(kind){
  if(kind==="maison") return showMaison();
  if(kind==="journal") return showJournal();
  hideMaison(); hideJournal();
  const wasOpen=document.body.classList.contains("open");
  cur=-1; page=kind; document.body.classList.add("open"); setNav(kind);
  grid.classList.remove("dim"); applyFilter(false,false);
  const bar=`<div class="bar" style="justify-content:flex-end"><button class="u" id="close">${t("close")}</button></div>`;
  panel.innerHTML = kind==="auto" ? `<div class="page">${bar}
      <h2 style="margin-top:0">${t("autoH")}</h2><p>${t("autoP")}</p>
      ${AUTO[L].map((a,i)=>`<div class="auto"><div class="k">${pad(i+1)}</div><h3>${a.n}</h3><div class="hd">${a.h}</div><p>${a.d}</p>
        <div class="flow">${a.flow.map((f,j)=>`${j?'<span class="arw"></span>':''}<div class="node"><div class="ico">${AICON[f[0]]}${f[3]==="dots"?`<span class="dots">${a.legend.map(c=>`<i style="background:${c[0]}"></i>`).join("")}</span>`:""}</div><b>${f[1]}</b><small>${f[2]}</small></div>`).join("")}</div>
        ${a.legend?`<div class="legend">${a.legend.map(c=>`<span><i style="background:${c[0]}"></i>${c[1]}</span>`).join("")}</div>`:""}
        <div class="note">${a.note}</div><div class="res"><div class="rk">${t("result")}</div><div class="rn"><b>${a.res[0]}</b><span>${a.res[1]}</span></div><p>${a.res[2]}</p></div></div>`).join("")}
    </div>` : `<div class="qv">
      <div class="vis portrait"><img src="${PHOTO}" alt=""></div>
      <div class="tx">${bar}
      <div class="k">${t("maisonK")}</div><h2>${t("maisonH")}</h2>
      <p>${t("m1")}</p><p style="margin-top:12px">${t("m2")}</p>
      <a class="btn" href="https://betob.lovable.app/linkedin" target="_blank" rel="noopener">${t("write")}</a>
      <div class="k" style="margin-top:34px">${t("career")}</div>
      <div class="list career">${t("jobs").map(j=>`<div><b>${j[0]}<span>${j[1]}</span></b><small>${j[2]}</small></div>`).join("")}</div>
      <div class="brands">${t("brands")}</div>
      <div class="k" style="margin-top:34px">${t("toolsK")}</div>
      <div class="list">${TOOLN.map((n,i)=>`<div><span>${n}</span><span>${t("tools")[i]}</span></div>`).join("")}</div>
    </div></div>`;
  panel.querySelector("#close").onclick=closePanel;
  syncHH();
}
function setLang(l){
  L=l; try{localStorage.setItem("betob-lang",l);}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("cur",b.dataset.l===l));
  document.getElementById("av").setAttribute("aria-label",t("maison"));
  renderFilters();
  grid.querySelectorAll(".tile").forEach((el,i)=>el.querySelector(".c").textContent=pc(P[i],"cat"));
  renderMaison(); if(page=="journal") renderJournal();
  if(cur>=0) openProject(cur,shot); else if(page==="auto") openPage("auto");
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
  const k=b.dataset.go;
  if(k==="projets"){ hideMaison(); hideJournal(); closePanel(); window.scrollTo({top:0,behavior:"smooth"}); }
  else openPage(k);
});
document.getElementById("mphoto").src=PHOTO;
document.getElementById("copy").onclick=async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText("belinda.betob@gmail.com");b.textContent=t("copied");setTimeout(()=>b.textContent=t("copy"),1600);}catch(err){}};
document.getElementById("jclose").onclick=()=>{hideJournal(); window.scrollTo({top:0});};
document.getElementById("mclose").onclick=()=>{hideMaison(); window.scrollTo({top:0});};
document.getElementById("wm").onclick=()=>{hideMaison();hideJournal();closePanel();window.scrollTo({top:0,behavior:"smooth"});};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ hideMaison(); hideJournal(); closePanel(); }
  if(cur>=0 && e.key==="ArrowRight") setShot((shot+1)%P[cur].s.length,1);
  if(cur>=0 && e.key==="ArrowLeft") setShot((shot-1+P[cur].s.length)%P[cur].s.length,-1);
});
let small=false;
function setPad(){
  const els=[hd,...hd.querySelectorAll(".wm,.sub")];
  els.forEach(e=>e.style.transition="none");
  const was=hd.classList.contains("small"); hd.classList.remove("small");
  document.body.style.paddingTop=hd.offsetHeight+"px";
  if(was) hd.classList.add("small");
  void hd.offsetHeight; els.forEach(e=>e.style.transition="");
  syncHH();
}
addEventListener("scroll",()=>{
  const y=scrollY, s=small?y>20:y>90;
  if(s!==small){small=s; hd.classList.toggle("small",s); setTimeout(syncHH,380);}
},{passive:true});
document.fonts&&document.fonts.ready.then(setPad);
let rz; addEventListener("resize",()=>{setPad(); clearTimeout(rz); rz=setTimeout(()=>applyFilter(false,false),200);});

renderGrid(true);
setLang(L);
setPad();
</script>
